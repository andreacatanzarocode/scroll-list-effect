<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
	<!-- 💚 GSAP DECLARATION -->
        <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <!-- 💚 GSAP DECLARATION -->
    <script defer src="main.js"></script>
</head>
<body>
    <nav>
        <div class="author small-txt">Andrea Catanzaro</div>
        <a href="https://www.instagram.com/andreacatanzarodesign" class="small-txt">🔗 Instagram</a>
    </nav>
    
    <img src="" alt="" class="image-banner">

    <main>
        <div class="spacer"></div>

        <div class="list-wrapper">
            <div class="inner-wrapper">
                <div class="row" data-image="images/apple.jpg">
                    <span class="txt">Apple</span>
                    <img src="logos/apple.svg" alt="Apple Logo" class="img-logo">
                </div>
                <div class="row" data-image="images/microsoft.avif">
                    <span class="txt">Microsoft</span>
                    <img src="logos/microsoft.svg" alt="Microsoft Logo" class="img-logo">
                </div>
                <div class="row" data-image="images/nike.jpg">
                    <span class="txt">Nike</span>
                    <img src="logos/nike.svg" alt="Nike Logo" class="img-logo">
                </div>
                <div class="row" data-image="images/mcdonald.webp">
                    <span class="txt">McDonald</span>
                    <img src="logos/mcdonald.svg" alt="Mcdonald Logo" class="img-logo">
                </div>
                <div class="row" data-image="images/instagram.webp">
                    <span class="txt">Instagram</span>
                    <img src="logos/instagram.svg" alt="Instagram Logo" class="img-logo">
                </div>
                <div class="row" data-image="images/google.webp">
                    <span class="txt">Google</span>
                    <img src="logos/google.svg" alt="Google Logo" class="img-logo">
                </div>
                <div class="row" data-image="images/amazon.webp">
                    <span class="txt">Amazon</span>
                    <img src="logos/amazon.svg" alt="Amazon Logo" class="img-logo">
                </div>
                <div class="row" data-image="images/netflix.jpg">
                    <span class="txt">Netflix</span>
                    <img src="logos/netflix.svg" alt="Netflix Logo" class="img-logo">
                </div>
                <div class="row" data-image="images/marvel.jpg">
                    <span class="txt">Marvel</span>
                    <img src="logos/marvel.svg" alt="Marvel Logo" class="img-logo">
                </div>
                <div class="row" data-image="images/coca-cola.avif">
                    <span class="txt">Coca-Cola</span>
                    <img src="logos/coca-cola.svg" alt="Coca-Cola Logo" class="img-logo">
                </div>
                <div class="row" data-image="images/samsung.jpg">
                    <span class="txt">Samsung</span>
                    <img src="logos/samsung.svg" alt="Samsung Logo" class="img-logo">
                </div>
                <div class="row" data-image="images/adobe.jpg">
                    <span class="txt">Adobe</span>
                    <img src="logos/adobe.svg" alt="Adobe Logo" class="img-logo">
                </div>
                <div class="row" data-image="images/facebook.webp">
                    <span class="txt">Facebook</span>
                    <img src="logos/facebook.svg" alt="Facebook Logo" class="img-logo">
                </div>
            </div>
        </div>

        <div class="spacer"></div>
    </main>
    
</body>
</html>
